name: Publish to PyPI

# Triggers when you publish a GitHub Release (tag the release e.g. v0.1.0 to
# match the version in pyproject.toml). Uses PyPI "Trusted Publishing" (OIDC) —
# no API token/secret needed, but you must register this repo+workflow as a
# trusted publisher on the PyPI project first. See README.md "Publishing".
on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow manual runs from the Actions tab too

jobs:
  build:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
