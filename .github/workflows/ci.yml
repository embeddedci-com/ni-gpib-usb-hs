name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libusb (for pyusb import)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0

      - name: Install package
        run: python -m pip install --upgrade pip build && python -m pip install .

      - name: Import smoke test
        run: python -c "import ni_gpib_usb_hs; print(ni_gpib_usb_hs.__version__)"

      - name: Build sdist + wheel
        run: python -m build

      - name: Compile-check examples
        run: python -m py_compile examples/*.py
